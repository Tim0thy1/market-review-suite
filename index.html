<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨市场复盘报告</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;--accent:#1e3a5f;--accent2:#2563eb;--green:#16a34a;--amber:#d97706}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans CJK SC','Microsoft YaHei',-apple-system,sans-serif;line-height:1.6;font-size:14px;min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:32px 20px}
.header{text-align:center;padding:40px 20px 32px;border-bottom:2px solid var(--accent);margin-bottom:32px}
.header h1{font-size:28px;font-weight:800;color:var(--accent);margin-bottom:8px;letter-spacing:1px}
.header .subtitle{color:var(--text2);font-size:14px}
.header .badge{display:inline-block;margin-top:10px;padding:4px 16px;background:var(--accent);color:#fff;border-radius:20px;font-size:12px;font-weight:600}
.stats{display:flex;justify-content:center;gap:32px;margin:18px 0 0}
.stat{text-align:center}
.stat .num{font-size:24px;font-weight:800;color:var(--accent2)}
.stat .label{font-size:12px;color:var(--text2)}
#loading{text-align:center;padding:60px 0;color:var(--text2)}
#loading .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
#content{display:none}
.date-group{margin-bottom:28px}
.date-header{font-size:18px;font-weight:800;color:var(--accent);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.date-header .tag{font-size:11px;font-weight:600;padding:2px 10px;border-radius:10px;color:#fff}
.tag-today{background:var(--green)}
.tag-past{background:var(--text2)}
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.report-card{border:1px solid var(--border);border-radius:12px;padding:18px;background:var(--card);transition:all .2s;text-decoration:none;color:var(--text);display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.report-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,58,95,.12);border-color:var(--accent2)}
.report-card .type{font-size:11px;font-weight:700;padding:2px 10px;border-radius:6px;display:inline-block;width:fit-content;margin-bottom:8px}
.type-us{background:#eff6ff;color:#1d4ed8}
.type-ashare{background:#fef2f2;color:#b91c1c}
.type-premarket{background:#f0fdf4;color:#15803d}
.type-video{background:#fffbeb;color:#92400e}
.report-card .title{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.4}
.report-card .desc{font-size:12.5px;color:var(--text2);line-height:1.5;flex:1}
.report-card .arrow{color:var(--accent2);font-size:13px;margin-top:8px;font-weight:600}
.footer{text-align:center;padding:32px;color:var(--text2);font-size:12px;border-top:1px solid var(--border);margin-top:20px}
#error{display:none;text-align:center;padding:60px 20px;color:var(--text2)}
#error .icon{font-size:40px;margin-bottom:12px}
@media(max-width:600px){.report-grid{grid-template-columns:1fr}.stats{gap:16px}}
</style>
</head>
<body>
<div class="container">

<div class="header">
<h1>跨市场复盘报告</h1>
<div class="subtitle">美股复盘 · A股复盘 · 盘前分析 · 盘前视频</div>
<div class="badge">自动同步 · 每日更新</div>
<div id="stats" class="stats">
<div class="stat"><div class="num" id="countReports">-</div><div class="label">报告总数</div></div>
<div class="stat"><div class="num" id="countDays">-</div><div class="label">交易日</div></div>
<div class="stat"><div class="num" id="countMarkets">-</div><div class="label">市场</div></div>
</div>
</div>

<div id="loading">
<div class="spinner"></div>
正在加载报告列表...
</div>

<div id="error">
<div class="icon">⚠️</div>
<p>加载失败，请稍后刷新重试</p>
<p id="errorMsg" style="font-size:12px;margin-top:8px"></p>
</div>

<div id="content"></div>

<div class="footer">
<p>market-review-suite · 跨市场复盘工具集</p>
<p>基于公开数据生成，不构成投资建议</p>
</div>

</div>

<script>
const OWNER = 'Tim0thy1';
const REPO = 'market-review-suite';
const BRANCH = 'master';
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents?ref=${BRANCH}`;

const TYPE_CONFIG = {
  'a-share-review':    { label: 'A股复盘',   cls: 'type-ashare',    icon: '📊' },
  'us-market-review':  { label: '美股复盘',   cls: 'type-us',        icon: '🇺🇸' },
  'a-share-premarket': { label: '盘前分析',   cls: 'type-premarket', icon: '🔮' },
  'premarket-video':   { label: '视频脚本',   cls: 'type-video',     icon: '🎬' },
};

async function load() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error(`GitHub API ${res.status}: ${res.statusText}`);
    const items = await res.json();
    if (!Array.isArray(items)) throw new Error('unexpected response');

    const dirs = items.filter(i => i.type === 'dir');
    const reportDirs = dirs.filter(d => /^(a-share-review|us-market-review|a-share-premarket|premarket-video)-\d{8}$/.test(d.name));

    // 按日期分组
    const groups = {};
    for (const dir of reportDirs) {
      const match = dir.name.match(/^(\w+)-(\d{8})$/);
      if (!match) continue;
      const prefix = match[1];
      const dateStr = match[2];
      const dateObj = new Date(dateStr.replace(/^(\d{4})(\d{2})(\d{2})$/, '$1-$2-$3'));
      if (!groups[dateStr]) groups[dateStr] = { dateObj, reports: [] };
      groups[dateStr].reports.push({ prefix, dirName: dir.name, dirUrl: dir.url });
    }

    // 获取每个目录内的 html/txt 文件
    const allEntries = [];
    for (const [dateStr, group] of Object.entries(groups)) {
      for (const r of group.reports) {
        try {
          const sub = await fetch(r.dirUrl);
          if (!sub.ok) continue;
          const files = await sub.json();
          if (!Array.isArray(files)) continue;
          const targets = files.filter(f => f.type === 'file' && /\.(html|txt)$/.test(f.name));
          for (const f of targets) {
            allEntries.push({ dateStr, dateObj: group.dateObj, prefix: r.prefix, dirName: r.dirName, file: f });
          }
        } catch (_) {}
      }
    }

    // 按日期降序排列
    const dateMap = {};
    for (const e of allEntries) {
      if (!dateMap[e.dateStr]) dateMap[e.dateStr] = { dateObj: e.dateObj, entries: [] };
      dateMap[e.dateStr].entries.push(e);
    }

    const sortedDates = Object.keys(dateMap).sort((a, b) => b.localeCompare(a));

    // 今日日期
    const todayStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
    const yesterdayStr = yesterday.toISOString().slice(0, 10).replace(/-/g, '');

    // 渲染
    const container = document.getElementById('content');
    let totalReports = 0;
    const markets = new Set();

    for (const dateStr of sortedDates) {
      const g = dateMap[dateStr];
      g.entries.sort((a, b) => {
        const order = ['a-share-review', 'us-market-review', 'a-share-premarket', 'premarket-video'];
        return order.indexOf(a.prefix) - order.indexOf(b.prefix);
      });

      const isToday = dateStr === todayStr;
      const isYesterday = dateStr === yesterdayStr;
      let tag = '';
      if (isToday) tag = '<span class="tag tag-today">今日</span>';
      else if (isYesterday) tag = '<span class="tag tag-past">昨日</span>';

      const y = g.dateObj.getFullYear();
      const m = String(g.dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(g.dateObj.getDate()).padStart(2, '0');
      const weekday = ['日', '一', '二', '三', '四', '五', '六'][g.dateObj.getDay()];

      totalReports += g.entries.length;

      let html = `<div class="date-group"><div class="date-header">${y}-${m}-${d} （周${weekday}） ${tag}</div><div class="report-grid">`;
      for (const e of g.entries) {
        const cfg = TYPE_CONFIG[e.prefix] || { label: e.prefix, cls: '', icon: '📄' };
        const filePath = e.dirName + '/' + e.file.name;
        markets.add(cfg.label);
        html += `<a class="report-card" href="./${filePath}">
          <div class="type ${cfg.cls}">${cfg.icon} ${cfg.label}</div>
          <div class="title">${cfg.label} · ${m}月${d}日</div>
          <div class="desc">${e.file.name.replace(/\.(html|txt)$/, '')}</div>
          <div class="arrow">查看报告 →</div>
        </a>`;
      }
      html += '</div></div>';
      container.innerHTML += html;
    }

    document.getElementById('countReports').textContent = totalReports;
    document.getElementById('countDays').textContent = sortedDates.length;
    document.getElementById('countMarkets').textContent = markets.size;
    document.getElementById('loading').style.display = 'none';
    container.style.display = 'block';

  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error');
    document.getElementById('errorMsg').textContent = err.message;
    el.style.display = 'block';
  }
}

load();
</script>
</body>
</html>
