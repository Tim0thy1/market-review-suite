<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨市场复盘报告</title>
<link rel="stylesheet" href="https://tim0thy1.github.io/design-system/design-system.css">
<style>
:root{
  --card:var(--bg2);
  --border:var(--rule);
  --text:var(--ink);
  --text2:var(--muted);
  --amber:var(--accent2);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans CJK SC','Microsoft YaHei',-apple-system,sans-serif;line-height:1.6;font-size:14px;min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:32px 20px}
.header{text-align:center;padding:40px 20px 32px;border-bottom:2px solid var(--accent);margin-bottom:32px}
.header h1{font-size:28px;font-weight:800;color:var(--accent);margin-bottom:8px;letter-spacing:1px}
.header .subtitle{color:var(--text2);font-size:14px}
.header .badge{display:inline-block;margin-top:10px;padding:4px 16px;background:var(--accent);color:#fff;border-radius:20px;font-size:12px;font-weight:600}
.stats{display:flex;justify-content:center;gap:32px;margin:18px 0 0;min-height:44px;align-items:center}
.stat{text-align:center}
.stat .num{font-size:24px;font-weight:800;color:var(--accent2)}
.stat .label{font-size:12px;color:var(--text2)}
.date-group{margin-bottom:28px}
.date-header{font-size:18px;font-weight:800;color:var(--accent);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.date-header .tag{font-size:11px;font-weight:600;padding:2px 10px;border-radius:10px;color:#fff}
.tag-today{background:var(--green)}
.tag-past{background:var(--text2)}
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.report-card{border:1px solid var(--border);border-radius:12px;padding:18px;background:var(--card);transition:all .2s;text-decoration:none;color:var(--text);display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.report-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,58,95,.12);border-color:var(--accent2);color:var(--text)}
.report-card .type{font-size:11px;font-weight:700;padding:2px 10px;border-radius:6px;display:inline-block;width:fit-content;margin-bottom:8px}
.type-us{background:var(--accent-soft);color:var(--accent)}
.type-ashare{background:var(--red-dim);color:var(--red)}
.type-premarket{background:var(--green-dim);color:var(--green)}
.type-weekend{background:rgba(249,115,22,0.15);color:var(--accent2)}
.report-card .title{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.4}
.report-card .desc{font-size:12.5px;color:var(--text2);line-height:1.5;flex:1}
.report-card .arrow{color:var(--accent2);font-size:13px;margin-top:8px;font-weight:600}
.footer{text-align:center;padding:32px;color:var(--text2);font-size:12px;border-top:1px solid var(--border);margin-top:20px}
.loading{text-align:center;color:var(--text2);padding:40px 0;font-size:14px}
.error{text-align:center;color:var(--red, #dc2626);padding:40px 0;font-size:14px}
.cat-nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 0 4px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:10;border-bottom:1px solid var(--border)}
.cat-nav a{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:24px;background:var(--card);border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:13px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.03);transition:all .2s}
.cat-nav a:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(217,119,6,.18);border-color:var(--accent2)}
.cat-nav a.cat-active{background:linear-gradient(135deg,var(--accent2),#F97316);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(217,119,6,.28)}
.cat-nav a .ic{font-size:15px}
@media(max-width:600px){.cat-nav{gap:6px}.cat-nav a{padding:7px 12px;font-size:12px}}
@media(max-width:768px){.content-wrap{scroll-margin-top:120px}}
@media(max-width:600px){.content-wrap{scroll-margin-top:140px}}
@media(max-width:600px){.report-grid{grid-template-columns:1fr}.stats{gap:16px}}
</style>
<script>
/* 主题跟随 */
(function(){
  try{
    var t = localStorage.getItem('wb_theme_v1') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    window.addEventListener('storage', function(e){
      if(e.key === 'wb_theme_v1') document.documentElement.setAttribute('data-theme', e.newValue || 'light');
    });
  }catch(e){}
})();
</script>
</head>
<body>
<div class="container">

<div class="header">
<h1>跨市场复盘报告</h1>
<div class="subtitle">美股复盘 · A股复盘 · 周末复盘 · 盘前分析</div>
<div class="badge">自动扫描 · 实时同步 GitHub 报告目录</div>
<div class="stats" id="stats">
  <div class="stat"><div class="num" id="n-total">…</div><div class="label">报告总数</div></div>
  <div class="stat"><div class="num" id="n-days">…</div><div class="label">交易日</div></div>
  <div class="stat"><div class="num" id="n-types">…</div><div class="label">类型</div></div>
</div>
</div>

<nav class="cat-nav" id="catNav">
  <a href="#S-weekend" class="cat-active" data-cat="weekend"><span class="ic">📖</span>周末复盘</a>
  <a href="#S-us" data-cat="us"><span class="ic">🇺🇸</span>美股复盘</a>
  <a href="#S-ashare" data-cat="ashare"><span class="ic">📈</span>A股复盘</a>
  <a href="#S-premarket" data-cat="premarket"><span class="ic">📅</span>盘前分析</a>
</nav>

<div id="reportRoot">
  <div class="loading">正在从 GitHub 扫描报告目录…</div>
</div>

<div class="footer">
<p>market-review-suite · 跨市场复盘工具集</p>
<p>本页自动读取 GitHub <code>master</code> 分支报告目录 · 实时同步 · 基于公开数据生成，不构成投资建议</p>
</div>

</div>

<script>
/* ============ 动态报告渲染：实时读取 GitHub 仓库目录 ============ */
(function(){
  var REPO = "Tim0thy1/market-review-suite";
  var BRANCH = "master";
  var API = "https://api.github.com/repos/" + REPO + "/git/trees/" + BRANCH + "?recursive=1";
  var BASE = "https://tim0thy1.github.io/" + REPO + "/";   // github pages 直链
  var CACHE = "mr-index-cache-" + BRANCH;

  var CATS = [
    {key:"weekend",  name:"周末复盘",   ic:"📖", type:"type-weekend"},
    {key:"us",       name:"美股复盘",  ic:"🇺🇸", type:"type-us"},
    {key:"ashare",   name:"A股复盘",   ic:"📈", type:"type-ashare"},
    {key:"premarket",name:"盘前分析",  ic:"📅", type:"type-premarket"}
  ];

  function bjYMD(d){
    var n = new Date(d.getTime() + d.getTimezoneOffset()*60000 + 28800*1000); // 转北京
    var y = n.getUTCFullYear(), m = n.getUTCMonth()+1, dd = n.getUTCDate();
    return y*10000 + m*100 + dd;
  }
  var TODAY = bjYMD(new Date());
  var YESTERDAY = bjYMD(new Date(Date.now()-86400000));

  function classify(path){
    if (path.indexOf("周末复盘") !== -1) return "weekend";
    if (path.indexOf("盘前") !== -1 || /premarket/i.test(path)) return "premarket";
    if (path.indexOf("美股") !== -1) return "us";
    if (path.indexOf("A股") !== -1 || /a-share/i.test(path)) return "ashare";
    return null;
  }
  function extractDate(path){
    var m = path.match(/(20\d{2})[-.](\d{2})[-.](\d{2})/);
    if (m) return +(m[1]+m[2]+m[3]);
    m = path.match(/(20\d{2})(\d{2})(\d{2})/);
    if (m) return +(m[1]+m[2]+m[3]);
    return null;
  }
  function nameOf(cat){ for (var i=0;i<CATS.length;i++) if(CATS[i].key===cat) return CATS[i].name; return cat; }
  function icOf(cat){ for (var i=0;i<CATS.length;i++) if(CATS[i].key===cat) return CATS[i].ic; return ""; }
  function typeOf(cat){ for (var i=0;i<CATS.length;i++) if(CATS[i].key===cat) return CATS[i].type; return ""; }
  var WD = ["周一","周二","周三","周四","周五","周六","周日"];
  function fmtDate(d8){
    var y=Math.floor(d8/10000), mo=Math.floor(d8/100)%100, d=d8%100;
    var wd="";
    try{ wd=WD[new Date(y,mo-1,d).getDay()===0?6:new Date(y,mo-1,d).getDay()-1]; }catch(e){}
    return y+"年"+mo+"月"+d+"日"+wd;
  }
  function tagFor(d8){
    if (d8===TODAY) return '<span class="tag tag-today">今日</span>';
    if (d8===YESTERDAY) return '<span class="tag tag-past">昨日</span>';
    return "";
  }
  function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  function dedup(list){
    var best={}, keep={};
    for (var i=0;i<list.length;i++){
      var core=list[i].path.split("/").pop().replace(/\.html$/i,"");
      if (core.indexOf("_test") !== -1) continue;
      var m=core.match(/_v(\d+)$/), ver=m?+m[1]:0, base=core.replace(/_v\d+$/,"");
      if (!best[base] || ver>best[base].v){ best[base]={v:ver,item:list[i]}; }
    }
    for (var b in best) keep[best[b].item.path]=1;
    return list.filter(function(x){ return !!keep[x.path]; });
  }

  function cardHtml(x, d){
    var fname=x.path.split("/").pop();
    var title="A股 · "+nameOf(x.cat)+" · "+Math.floor(d/100)%100+"月"+d%100+"日";
    var href=BASE+esc(encodeURI(x.path));   // 中文路径做百分号编码，避免线上 404
    return '<a class="report-card" data-cat="'+x.cat+'" href="'+href+'" target="_blank">'
      +'<div class="type '+typeOf(x.cat)+'">'+icOf(x.cat)+' '+nameOf(x.cat)+'</div>'
      +'<div class="title">'+esc(title)+'</div>'
      +'<div class="desc">'+esc(fname.replace(/\.html$/i,""))+'</div>'
      +'<div class="arrow">查看报告 →</div></a>';
  }

  function render(files){
    // 按日期聚合当日全部类型报告
    var byDate={};
    var skipRoots=["tools/",".git","节点","深度专题"];
    files.forEach(function(path){
      if (path==="index.html") return;
      if (!/\.html$/i.test(path)) return;
      if (/^[,.]/.test(path)) return;
      for (var i=0;i<skipRoots.length;i++){ if (path.indexOf(skipRoots[i])===0) return; }
      var cat=classify(path); if (!cat) return;
      var date=extractDate(path); if (!date) return;
      (byDate[date]=byDate[date]||[]).push({cat:cat,path:path});
    });
    // 同日去重
    var total=0;
    Object.keys(byDate).forEach(function(d){ byDate[d]=dedup(byDate[d]); total+=byDate[d].length; });
    var dates=Object.keys(byDate).map(Number).sort(function(a,b){return b-a;});
    var nTypes=CATS.filter(function(c){
      return Object.keys(byDate).some(function(d){ return byDate[d].some(function(x){ return x.cat===c.key; }); });
    }).length;
    document.getElementById("n-total").textContent=total;
    document.getElementById("n-days").textContent=dates.length;
    document.getElementById("n-types").textContent=nTypes;

    // 构建：每个日期一个区块，当日所有类型卡片并排
    var html="";
    dates.forEach(function(d){
      var cards=byDate[d].map(function(x){ return cardHtml(x, d); }).join("\n");
      html += '<div class="date-group content-wrap" data-date="'+d+'">'
        +'<div class="date-header">'+fmtDate(d)+' '+tagFor(d)+'</div>'
        +'<div class="report-grid content-wrap">'+cards+'</div></div>';
    });
    document.getElementById("reportRoot").innerHTML = html;
  }

  function hrefSafe(p){ return esc(p); }

  function showError(msg){
    document.getElementById("reportRoot").innerHTML =
      '<div class="error">⚠️ 无法实时读取 GitHub 目录：'+esc(msg)+'<br>'
      +'可尝试 <a href="'+BASE+'index.html">点击刷新重试</a>，或稍后重开本页。</div>';
  }

  function loadFromRemote(){
    return fetch(API).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    }).then(function(data){
      var files=(data.tree||[]).map(function(t){return t.path;});
      try{ localStorage.setItem(CACHE, JSON.stringify({at:Date.now(), files:files})); }catch(e){}
      render(files);
    });
  }

  function renderCached(files){
    render(files);
    loadFromRemote().catch(function(){ /* 静默，已有缓存渲染 */ });
  }

  // 先用缓存即时出页面，再从 GitHub 实时刷新
  try{
    var cached=localStorage.getItem(CACHE);
    if(cached){ var obj=JSON.parse(cached); if(obj && obj.files) renderCached(obj.files); }
    else loadFromRemote().catch(function(e){ showError(e.message||"网络错误"); });
  }catch(e){ loadFromRemote().catch(function(x){ showError(x.message||"网络错误"); }); }

  /* 分类导航：滚动到该类型首个报告所在日期组并高亮 */
  var nav=document.getElementById("catNav");
  if(nav){
    var links=nav.querySelectorAll("a");
    links.forEach(function(a){
      a.addEventListener("click",function(e){
        e.preventDefault();
        var t=a.getAttribute("data-cat");
        var root=document.getElementById("reportRoot");
        var target=null;
        if(root){
          var cards=root.querySelectorAll('[data-cat="'+t+'"]');
          if(cards.length){ var g=cards[0].closest?cards[0].closest(".date-group"):null; target=g||cards[0]; }
        }
        if(target){ target.scrollIntoView({behavior:"smooth",block:"start"}); }
        links.forEach(function(x){x.classList.remove("cat-active");});
        a.classList.add("cat-active");
      });
    });
  }
})();
</script>
</body>
</html>
